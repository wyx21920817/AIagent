version: '3.8'

services:
  aiagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiagent
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/aiclinic
      - ORTHANC_SERVER_URL=http://orthanc:8042
      - AUTH_SERVER_URL=http://webserverauth:8001
      - AIAGENT_URL=http://127.0.0.1:8888
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    networks:
      - aiclinic-net

networks:
  aiclinic-net:
    external: true
